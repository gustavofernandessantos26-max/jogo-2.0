<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers 2D - Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            background-color: #555;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 10px;
        }
        .instrucoes {
            margin-top: 15px;
            text-align: center;
        }
        kbd {
            background-color: #444;
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #777;
        }
    </style>
</head>
<body>

    <div class="instrucoes">
        <p>Use as setas <kbd>⬅️</kbd> e <kbd>➡️</kbd> para mover e <kbd>⬆️</kbd> para pular.</p>
        <p>Aperte <strong>ESPAÇO</strong> para reiniciar.</p>
    </div>

            pulando: false,

            cor: "#00bfff"

                } else if (e.code === "ArrowUp" && !player.pulando) {
                    pular();
