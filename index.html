<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers - Com Marcador de Distância</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        canvas {
            background-color: #8b9bb4;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            border: 4px solid #fff;
        }
        .painel {
            margin-top: 15px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
        }
        kbd {
            background-color: #fff;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="360" height="600"></canvas>
    
    <div class="painel">
        <p>Movimento: <kbd>⬅️</kbd> <kbd>➡️</kbd> | Pulo: <kbd>⬆️</kbd> | Reiniciar: <kbd>ESPAÇO</kbd></p>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Sistema de Jogo
        const LARGURA_PISTA = canvas.width / 3;
        let estadoJogo = "inicio"; // inicio, jogando, gameover
        let moedas = 0;
        let distancia = 0; // Nova variável de distância
        let velocidadePista = 6;
        let frameCount = 0;
        let offsetPista = 0; 

        // Jogador
        const player = {
            pista: 1, 
            x: canvas.width / 2,
            y: canvas.height - 120,
            z: 0,          
            vz: 0,         
            gravidade: 1.2,
            pulando: false,
            raio: 20
        };

        // Entidades (Obstáculos e Moedas)
        let entidades = [];

        // Controles
        document.addEventListener("keydown", (e) => {
            if (estadoJogo === "inicio" || estadoJogo === "gameover") {
                if (e.code === "Space" || e.code === "ArrowUp") iniciarJogo();
                return;
            }

            if (e.code === "ArrowLeft" && player.pista > 0) player.pista--;
            if (e.code === "ArrowRight" && player.pista < 2) player.pista++;
            if (e.code === "ArrowUp" && !player.pulando) {
                player.pulando = true;
                player.vz = 16; 
            }
        });

        function spawnEntidade() {
            let pistaSorteada = Math.floor(Math.random() * 3);
            let tipoSorteio = Math.random();
            
            let tipo, emoji, tamanho, alturaZ;

            if (tipoSorteio < 0.3) {
                tipo = "moeda"; emoji = "🪙"; tamanho = 30; alturaZ = 0;
            } else if (tipoSorteio < 0.7) {
                tipo = "barreira"; emoji = "🚧"; tamanho = 40; alturaZ = 15;
            } else {
                tipo = "trem"; emoji = "🚆"; tamanho = 55; alturaZ = 100;
            }

            entidades.push({
                x: pistaSorteada * LARGURA_PISTA + (LARGURA_PISTA / 2),
                y: -50,
                tipo: tipo,
                emoji: emoji,
                tamanho: tamanho,
                alturaZ: alturaZ,
                ativa: true
            });
        }

        function atualizar() {
            if (estadoJogo !== "jogando") return;
            frameCount++;

            // A distância aumenta baseada na velocidade atual da pista
            distancia += velocidadePista * 0.05;

            // Aumenta a velocidade progressivamente
            if (frameCount % 500 === 0) velocidadePista += 0.5;

            // Animação da pista
            offsetPista += velocidadePista;
            if (offsetPista > 60) offsetPista = 0;

            // Spawn de entidades
            if (frameCount % Math.max(30, 80 - Math.floor(velocidadePista * 2)) === 0) {
                spawnEntidade();
            }

            // Movimento Horizontal do Jogador
            let destinoX = player.pista * LARGURA_PISTA + (LARGURA_PISTA / 2);
            player.x += (destinoX - player.x) * 0.25;

            // Física do Pulo (Eixo Z)
            if (player.pulando) {
                player.z += player.vz;
                player.vz -= player.gravidade;
                if (player.z <= 0) {
                    player.z = 0;
                    player.pulando = false;
                }
            }

            // Atualiza Entidades e Colisões
            for (let i = 0; i < entidades.length; i++) {
                let ent = entidades[i];
                ent.y += velocidadePista;

                if (ent.ativa) {
                    let distY = Math.abs(player.y - ent.y);
                    let distX = Math.abs(player.x - ent.x);

                    if (distX < 25 && distY < 30) {
                        if (ent.tipo === "moeda") {
                            moedas++;
                            ent.ativa = false;
                        } else {
                            if (player.z < ent.alturaZ) {
                                estadoJogo = "gameover";
                            }
                        }
                    }
                }

                if (ent.y > canvas.height + 100) {
                    entidades.splice(i, 1);
                    i--;
                }
            }
        }

        function desenhar() {
            // Fundo (Asfalto)
            ctx.fillStyle = "#4a4e59";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linhas da pista
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 6;
            ctx.setLineDash([30, 30]);
            for (let linha = 1; linha < 3; linha++) {
                ctx.beginPath();
                ctx.moveTo(linha * LARGURA_PISTA, -60 + offsetPista); 
                ctx.lineTo(linha * LARGURA_PISTA, canvas.height + 60);
                ctx.stroke();
            }
            ctx.setLineDash([]); 

            // HUD Superior (Placar de Distância e Moedas)
            if (estadoJogo === "jogando") {
                ctx.textAlign = "left";
                ctx.textBaseline = "top";
                ctx.font = "bold 20px 'Segoe UI', Arial";
                
                // Caixa de fundo para o HUD ficar legível
                ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                ctx.fillRect(10, 10, 140, 65);

                // Desenha os textos do HUD
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`🏃‍♂️ ${Math.floor(distancia)} m`, 20, 18);
                ctx.fillStyle = "gold";
                ctx.fillText(`🪙 ${moedas}`, 20, 44);
            }

            // Configuração para renderizar os elementos centrais
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // Desenha as Entidades
            for (let ent of entidades) {
                if (ent.ativa) {
                    ctx.fillStyle = "rgba(0,0,0,0.3)";
                    ctx.beginPath();
                    ctx.ellipse(ent.x, ent.y + 15, ent.tamanho/2.5, ent.tamanho/5, 0, 0, Math.PI*2);
                    ctx.fill();

                    ctx.font = `${ent.tamanho}px Arial`;
                    ctx.fillText(ent.emoji, ent.x, ent.y);
                }
            }

            // Desenha o Jogador
            if (estadoJogo !== "inicio") {
                let tamanhoSombra = Math.max(5, 20 - (player.z / 4));
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.beginPath();
                ctx.ellipse(player.x, player.y + 20, tamanhoSombra, tamanhoSombra/2, 0, 0, Math.PI*2);
                ctx.fill();

                let balancoCorrida = (!player.pulando && estadoJogo === "jogando") ? Math.sin(frameCount * 0.5) * 3 : 0;
                let tamanhoPlayer = 45 + (player.z / 8); 
                ctx.font = `${tamanhoPlayer}px Arial`;
                ctx.fillText("🏃‍♂️", player.x, player.y - player.z + balancoCorrida);
            }

            // Telas de Interface Overlays
            if (estadoJogo === "inicio") {
                desenharOverlay("SUBWAY RUNNER", "Pressione CIMA ou ESPAÇO para Iniciar");
            } else if (estadoJogo === "gameover") {
                desenharOverlay("FIM DE JOGO!", `Recorde: ${Math.floor(distancia)}m | 🪙 ${moedas}`);
            }
        }

        function desenharOverlay(titulo, subtitulo) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#fff";
            ctx.font = "bold 30px Arial";
            ctx.fillText(titulo, canvas.width / 2, canvas.height / 2 - 25);
            
            ctx.fillStyle = "#00ffcc";
            ctx.font = "16px Arial";
            ctx.fillText(subtitulo, canvas.width / 2, canvas.height / 2 + 25);
        }

        function iniciarJogo() {
            estadoJogo = "jogando";
            moedas = 0;
            distancia = 0; // Reseta a distância ao iniciar
            velocidadePista = 6;
            frameCount = 0;
            entidades = [];
            player.pista = 1;
            player.x = canvas.width / 2;
            player.z = 0;
            player.pulando = false;
        }

        function gameLoop() {
            atualizar();
            desenhar();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
