<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <style>
        /* Reset básico e tipografia */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* Container do formulário */
        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Grupos de input */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        /* Opções extras (Lembrar-me e Esqueci a senha) */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .options a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }

        .options a:hover {
            color: #764ba2;
        }

        /* Botão de Submit */
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-login:hover {
            background-color: #764ba2;
        }

        /* Mensagem de erro/sucesso */
        #mensagem {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        
        .sucesso { color: #28a745; }
        .erro { color: #dc3545; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Bem-vindo de volta</h2>
        
        <form id="formLogin">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            
            <div class="options">
                <label>
                    <input type="checkbox" name="lembrar"> Lembrar-me
                </label>
                <a href="#">Esqueceu a senha?</a>
            </div>
            
            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <p id="mensagem"></p>
    </div>

    <script>
        const formLogin = document.getElementById('formLogin');
        const mensagem = document.getElementById('mensagem');

        formLogin.addEventListener('submit', function(event) {
            // Previne que a página recarregue ao enviar o formulário
            event.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            // Mostra a mensagem no bloco
            mensagem.style.display = 'block';

            // Simulação de validação simples
            if (email === "admin@admin.com" && senha === "123456") {
                mensagem.textContent = "Login efetuado com sucesso! Redirecionando...";
                mensagem.className = "sucesso";
                
                // Limpa os campos após o sucesso
                formLogin.reset();
            } else {
                mensagem.textContent = "E-mail ou senha incorretos. Tente novamente.";
                mensagem.className = "erro";
            }
        });
    </script>
</body>
</html>
