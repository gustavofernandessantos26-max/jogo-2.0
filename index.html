<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers Clone - Com Agachamento</title>
    <style>
        /* Estilos Globais e Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
            user-select: none;
        }

        /* ==================== TELA DE LOGIN ==================== */
        #loginSection {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        #loginSection h2 {
            margin-bottom: 25px;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
            font-size: 26px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #00ffcc;
            color: #111;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #00cc99;
        }

        #mensagemErro {
            color: #ff4444;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        .dica-login {
            margin-top: 15px;
            font-size: 12px;
            color: #aaa;
        }

        /* ==================== SEÇÃO DO JOGO ==================== */
        #gameSection {
            display: none; 
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background-color: #8b9bb4;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            border: 4px solid #fff;
        }

        .painel {
            margin-top: 15px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
        }

        kbd {
            background-color: #fff;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="loginSection">
        <h2>SURFERS LOGIN</h2>
        <form id="formLogin">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Ex: admin@admin.com" required>
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Ex: 123456" required>
            </div>
            <button type="submit" class="btn-login">Entrar no Jogo</button>
        </form>
        <p id="mensagemErro">Usuário ou senha incorretos!</p>
        <p class="dica-login">Dica: admin@admin.com | 123456</p>
    </div>

    <div id="gameSection">
        <canvas id="gameCanvas" width="360" height="600"></canvas>
        <div class="painel">
            <p>Controles: <kbd>⬅️ / A</kbd> <kbd>➡️ / D</kbd> | Pulo: <kbd>⬆️ / W</kbd> | Agachar: <kbd>⬇️ / S</kbd> | Reiniciar: <kbd>ESPAÇO</kbd></p>
        </div>
    </div>

    <script>
        const loginSection = document.getElementById("loginSection");
        const gameSection = document.getElementById("gameSection");
        const formLogin = document.getElementById("formLogin");
        const mensagemErro = document.getElementById("mensagemErro");

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Autenticação
        formLogin.addEventListener("submit", function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            if (email === "admin@admin.com" && senha === "123456") {
                loginSection.style.display = "none";
                gameSection.style.display = "flex";
                gameLoop();
            } else {
                mensagemErro.style.display = "block";
            }
        });

        // ==================== LÓGICA DO JOGO ====================
        const LARGURA_PISTA = canvas.width / 3;
        let estadoJogo = "inicio"; 
        let moedas = 0;
        let distancia = 0; 
        let velocidadePista = 6;
        let frameCount = 0;
        let offsetPista = 0; 

        const player = {
            pista: 1, 
            x: canvas.width / 2,
            y: canvas.height - 120,
            z: 0,          
            vz: 0,         
            gravidade: 1.0, 
            pulando: false,
            agachando: false,       // Estado de agachamento adicionado
            tempoAgachado: 0        // Temporizador de agachamento adicionado
        };

        let entidades = [];

        // Captura do Teclado + Correção de Rolagem de Página
        document.addEventListener("keydown", (e) => {
            if (gameSection.style.display === "flex") {
                // Bloqueia a rolagem nativa do navegador ao jogar
                if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
                    e.preventDefault();
                }

                if (estadoJogo === "inicio" || estadoJogo === "gameover") {
                    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") iniciarJogo();
                    return;
                }

                if ((e.code === "ArrowLeft" || e.code === "KeyA") && player.pista > 0) player.pista--;
                if ((e.code === "ArrowRight" || e.code === "KeyD") && player.pista < 2) player.pista++;
                
                // Comando de Pulo
                if ((e.code === "ArrowUp" || e.code === "KeyW") && !player.pulando) {
                    // Cancelar agachamento se pular
                    player.agachando = false;
                    player.tempoAgachado = 0;
                    
                    player.pulando = true;
                    player.vz = 15; 
                }

                // Mapeamento das teclas de Agachar (ArrowDown ou KeyS)
                if ((e.code === "ArrowDown" || e.code === "KeyS") && !player.pulando) {
                    player.agachando = true;
                    player.tempoAgachado = 25; // Duração do agachamento em frames (~0.4 segundos)
                }
            }
        });

        function spawnEntidade() {
            let pistaSorteada = Math.floor(Math.random() * 3);
            let tipoSorteio = Math.random();
            let tipo, emoji, tamanho;

            if (tipoSorteio < 0.35) {
                tipo = "moeda"; emoji = "🪙"; tamanho = 30;
            } else if (tipoSorteio < 0.60) {
                tipo = "barreira"; emoji = "🚧"; tamanho = 40;
            } else if (tipoSorteio < 0.80) {
                // Novo obstáculo: Barreira suspensa que exige agachamento
                tipo = "barreira_alta"; emoji = "🛑"; tamanho = 40;
            } else {
                tipo = "trem"; emoji = "🚆"; tamanho = 55;
            }

            entidades.push({
                pista: pistaSorteada,
                x: pistaSorteada * LARGURA_PISTA + (LARGURA_PISTA / 2),
                y: -50,
                tipo: tipo,
                emoji: emoji,
                tamanho: tamanho,
                ativa: true
            });
        }

        function atualizar() {
            if (estadoJogo !== "jogando") return;
            frameCount++;

            distancia += velocidadePista * 0.05;

            if (frameCount % 500 === 0) velocidadePista += 0.5;

            offsetPista += velocidadePista;
            if (offsetPista > 60) offsetPista = 0;

            if (frameCount % Math.max(30, 75 - Math.floor(velocidadePista * 2)) === 0) {
                spawnEntidade();
            }

            // Transição visual suave de pista
            let destinoX = player.pista * LARGURA_PISTA + (LARGURA_PISTA / 2);
            player.x += (destinoX - player.x) * 0.25;

            // Física do Pulo (Eixo Z)
            if (player.pulando) {
                player.z += player.vz;
                player.vz -= player.gravidade;
                if (player.z <= 0) {
                    player.z = 0;
                    player.pulando = false;
                }
            }

            // Atualização do temporizador de agachamento
            if (player.agachando) {
                player.tempoAgachado--;
                if (player.tempoAgachado <= 0) {
                    player.agachando = false;
                }
            }

            // Processamento de Colisões precisas
            for (let i = 0; i < entidades.length; i++) {
                let ent = entidades[i];
                ent.y += velocidadePista;

                if (ent.ativa) {
                    let distY = Math.abs(player.y - ent.y);
                    
                    if (player.pista === ent.pista && distY < 35) {
                        if (ent.tipo === "moeda") {
                            moedas++;
                            ent.ativa = false;
                        } else if (ent.tipo === "barreira") {
                            // Se não pulou alto o suficiente -> Fim de jogo
                            if (player.z < 15) {
                                estadoJogo = "gameover";
                            }
                        } else if (ent.tipo === "barreira_alta") {
                            // Se NÃO estiver agachado -> Fim de jogo (Bate a cabeça)
                            if (!player.agachando) {
                                estadoJogo = "gameover";
                            }
                        } else if (ent.tipo === "trem") {
                            // Trens não podem ser pulados ou desviados por baixo
                            estadoJogo = "gameover";
                        }
                    }
                }

                if (ent.y > canvas.height + 100) {
                    entidades.splice(i, 1);
                    i--;
                }
            }
        }

        function desenhar() {
            // Limpa e pinta o asfalto
            ctx.fillStyle = "#4a4e59";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linhas tracejadas das pistas
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 6;
            ctx.setLineDash([30, 30]);
            
            for (let linha = 1; linha < 3; linha++) {
                ctx.beginPath();
                ctx.moveTo(linha * LARGURA_PISTA, -60 + offsetPista); 
                ctx.lineTo(linha * LARGURA_PISTA, canvas.height + 60);
                ctx.stroke();
            }
            ctx.setLineDash([]); 

            // Painel de Pontos (HUD)
            if (estadoJogo === "jogando") {
                ctx.textAlign = "left";
                ctx.textBaseline = "top";
                ctx.font = "bold 20px 'Segoe UI', Arial";
                ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                ctx.fillRect(10, 10, 140, 65);

                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`🏃‍♂️ ${Math.floor(distancia)} m`, 20, 18);
                ctx.fillStyle = "gold";
                ctx.fillText(`🪙 ${moedas}`, 20, 44);
            }

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // Renderiza Obstáculos e Moedas
            for (let ent of entidades) {
                if (ent.ativa) {
                    // Sombra do obstáculo (Barreiras altas têm sombra menor/diferente por estarem suspensas)
                    ctx.fillStyle = "rgba(0,0,0,0.25)";
                    ctx.beginPath();
                    let offsetSombra = ent.tipo === "barreira_alta" ? 40 : 18;
                    ctx.ellipse(ent.x, ent.y + offsetSombra, ent.tamanho/2.5, ent.tamanho/6, 0, 0, Math.PI*2);
                    ctx.fill();

                    ctx.font = `${ent.tamanho}px Arial`;
                    
                    // Se for barreira alta, renderiza visualmente um pouco mais acima na tela
                    if (ent.tipo === "barreira_alta") {
                        ctx.fillText(ent.emoji, ent.x, ent.y - 25);
                        // Desenha os postes de sustentação da placa suspensa
                        ctx.strokeStyle = "#ff4444";
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(ent.x - 15, ent.y); ctx.lineTo(ent.x - 15, ent.y - 25);
                        ctx.moveTo(ent.x + 15, ent.y); ctx.lineTo(ent.x + 15, ent.y - 25);
                        ctx.stroke();
                    } else {
                        ctx.fillText(ent.emoji, ent.x, ent.y);
                    }
                }
            }

            // Renderiza o Jogador
            if (estadoJogo !== "inicio") {
                let tamanhoSombra = Math.max(5, 20 - (player.z / 4));
                if (player.agachando) tamanhoSombra = 25; // Sombra maior quando desliza no skate

                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.beginPath();
                ctx.ellipse(player.x, player.y + 20, tamanhoSombra, tamanhoSombra/2, 0, 0, Math.PI*2);
                ctx.fill();

                let balancoCorrida = (!player.pulando && !player.agachando && estadoJogo === "jogando") ? Math.sin(frameCount * 0.6) * 4 : 0;
                
                // Seleção dinâmica do Emoji baseado no estado do jogador
                let emojiJogador = "🏃‍♂️";
                if (player.pulando) {
                    emojiJogador = "🦘"; // Opcional: muda no pulo
                } else if (player.agachando) {
                    emojiJogador = "🛹"; // Altera o emoji temporariamente enquanto agachado
                }

                ctx.font = "45px Arial";
                // Desenha levemente mais baixo se estiver agachado
                let offsetY = player.agachando ? 5 : 0; 
                ctx.fillText(emojiJogador, player.x, player.y - player.z + balancoCorrida + offsetY);
            }

            // Overlays de Interfaces
            if (estadoJogo === "inicio") {
                desenharOverlay("SUBWAY RUNNER", "Aperte CIMA, W ou ESPAÇO para iniciar");
            } else if (estadoJogo === "gameover") {
                desenharOverlay("FIM DE JOGO!", `Pontos: ${Math.floor(distancia)}m | 🪙 ${moedas}`);
            }
        }

        function desenharOverlay(titulo, subtitulo) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#fff";
            ctx.font = "bold 30px Arial";
            ctx.fillText(titulo, canvas.width / 2, canvas.height / 2 - 25);
            
            ctx.fillStyle = "#00ffcc";
            ctx.font = "16px Arial";
            ctx.fillText(subtitulo, canvas.width / 2, canvas.height / 2 + 25);
        }

        function iniciarJogo() {
            estadoJogo = "jogando";
            moedas = 0;
            distancia = 0; 
            velocidadePista = 6;
            frameCount = 0;
            entidades = [];
            player.pista = 1;
            player.x = canvas.width / 2;
            player.z = 0;
            player.pulando = false;
            player.agachando = false;
            player.tempoAgachado = 0;
        }

        function gameLoop() {
            atualizar();
            desenhar();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
